server:
  port: 8089

spring:
  application:
    name: users-service
  datasource:
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: http://naming-server:8761/eureka/
  instance:
    prefer-ip-address: true

